      Cosmos — Contact
    </title>
    <link rel="stylesheet" href="style.css?v=3">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index-en.html">
        <span class="brand-mark">
          ✦
        </span>
        <span>
          COSMOS
          <small>
            CELESTIAL ATLAS
          </small>
        </span>
      </a>
      <nav>
        <ul class="barre">
          <li>
            <a href="index-en.html">
              Home
            </a>
          </li>
          <li>
            <a href="galaxy-en.html">
              Galaxies
            </a>
          </li>
          <li>
            <a href="ciel_profond-en.html">
              Deep sky
            </a>
          </li>
          <li>
            <a href="voie_lactée-en.html">
              Milky Way
            </a>

          <li>
            <a class="active" href="contact-en.html">
              Contact
            </a>
          </li>
        </ul>
      </nav>
      <a class="language-switch" href="contact.html" lang="fr" aria-label="View this site in French">FR</a>
    </header>
    <main class="contact-wrap">
      <section class="contact-card">
        <span class="eyebrow">
          Message to Earth
        </span>
        <h1>
          Let’s stay in orbit.
        </h1>
        <p>
          Have a question or suggestion for our celestial atlas? Send us a signal.
        </p>
        <form id="contact-form">
          <div class="form-grid">
            <label>
              First name
              <input required name="prenom" placeholder="Your first name">
            </label>
            <label>
              Last name
              <input required name="nom" placeholder="Your last name">
            </label>
            <label>
              Email address
              <input required type="email" name="email" placeholder="you@example.com">
            </label>
            <label>
              Your message
              <textarea required name="message" placeholder="Write your message...">
              </textarea>
            </label>
          </div>
          <button class="button send" type="submit">
            Send the signal →
          </button>
          <p class="form-note" aria-live="polite">
          </p>
        </form>
      </section>
    </main>
    <footer>
      A project by Quentin ROSOLI and Bastien CRAVELLO — 2nd-year BTS CIEL IR
    </footer>
    <script src="app.js">
    </script>
  </body>
</html>
